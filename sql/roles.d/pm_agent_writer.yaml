# pm-agent: SELECT/INSERT/UPDATE (never DELETE) on its two tables only.
# pm_store.py UPDATEs pm_conversations (append messages) and feedback_signals
# (dedupe counters), so INSERT/SELECT alone fails with 42501 on every chat.
name: pm_agent_writer
login: true
password_key: PM_AGENT_WRITER_PASSWORD
dsn_key: PM_DATABASE_URL
grants:
  - schema: company
    tables: [pm_conversations, feedback_signals]
    privileges: [SELECT, INSERT, UPDATE]
