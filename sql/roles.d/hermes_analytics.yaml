# Read-only on company, observer and marketing (current + future tables).
name: hermes_analytics
login: true
password_key: ANALYTICS_PASSWORD
dsn_key: ANALYTICS_DATABASE_URL
grants:
  - schema: company
    tables: all
    privileges: [SELECT]
  - schema: observer
    tables: all
    privileges: [SELECT]
  # Also what the backup job connects as: it must read every dumped schema.
  - schema: marketing
    tables: all
    privileges: [SELECT]
