model:
  # tencent/hy3:free (the original default) was discontinued by Nous
  # entirely ("This model's free period has ended") — confirmed live
  # against Nous's own /v1/models listing, not guessed. upstage/solar-pro4
  # is Nous's current free-tier model explicitly built for "long-horizon
  # tasks and agentic workflows" — the best match for what Hermes actually
  # does — with the largest context window (524K) among the current free
  # options; the alternatives are either domain-narrow (InclusionAI's
  # health/finance Ling variants), coding-specific (Poolside's Laguna
  # models), or lack explicit reasoning support (Meituan LongCat).
  default: upstage/solar-pro4:free
  provider: custom:nous

fallback_providers:
  - provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash

custom_providers:
  - name: nous
    base_url: https://inference-api.nousresearch.com/v1
    key_env: NOUS_API_KEY
    extra_body:
      tags:
        - product=hermes-agent
        - user=hermes-agent
  # Fallback: kept working (TokenRouter, already funded elsewhere in this
  # project) in case the Nous free tier ever needs swapping again.
  - name: tokenrouter
    base_url: https://api.tokenrouter.com/v1
    key_env: TOKENROUTER_API_KEY

auxiliary:
  # Background aux tasks default to provider "auto", which probes native
  # nous/openrouter providers that are unconfigured/unfunded in this
  # deployment — repeated unhealthy-provider churn in gateway logs plus at
  # least one real failure ("Auxiliary title generation failed: HTTP 400...
  # missing tags"). Pin every aux slot (except vision, which needs
  # vision-capable models) to the same funded TokenRouter free model the
  # fallback lane already uses, and set free_only so the OpenRouter fallback
  # can never pick a paid SKU ("PAID lane engaged... may incur real spend").
  free_only: true
  compression:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  skills_hub:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  approval:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  mcp:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  title_generation:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  review:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  triage_specifier:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  kanban_decomposer:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  profile_describer:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  curator:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  monitor:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  memory_query_rewrite:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  tts_audio_tags:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  goal_judge:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  # Live-verification follow-up (2026-09-20): the 14 slots above were an
  # incomplete inventory of real auxiliary task names — grepping
  # call_llm(task=...)/get_*_auxiliary_client(...) call sites across the
  # deployed image found 5 more real aux tasks that were still silently
  # falling through to provider="auto" (nous churn continued live after
  # the first fix landed, confirmed via kubectl logs). Pin these too.
  kanban_estimator:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  moa_reference:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  moa_aggregator:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  background_review:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash
  call:
    provider: custom:tokenrouter
    model: z-ai/glm-5.3-flash

plugins:
  # axiom_usage ships compact token-usage/tool-call metrics to Axiom
  # (dataset bmh-company) — verified this doesn't touch anything else:
  # `hermes plugins list` showed 0/55 bundled plugins in an "enabled" state
  # before this change (Discord, the active model providers, etc. all
  # activate through their own env-var detection, not this generic registry).
  enabled:
    - axiom_usage

terminal:
  backend: local

display:
  tool_progress: log
  interim_assistant_messages: false

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  provider: ""

mcp_servers:
  steward:
    url: "https://buildmyhouse.stewardacs.xyz/mcp/sse"
    transport: sse
    headers:
      Authorization: "Bearer ${STEWARD_TOKEN}"
    connect_timeout: 30
    timeout: 300
  # Connects as hermes_analytics: SELECT-only, no write access to either
  # the company or observer schema. Production self-hosted Postgres.
  postgres_analytics:
    command: "npx"
    args: ["-y", "@microsoft/postgres-mcp", "run"]
    env:
      POSTGRES_MCP_CONNECTION_STRING: "${ANALYTICS_DATABASE_URL}"
    connect_timeout: 60
    timeout: 900
  # opencode_manager removed: it never worked (pointed at nonexistent
  # /opt/homely-ceo/* config dirs) and per SOUL.md was only ever "the
  # older" fallback for when engineering_manager is down — not something
  # Hermes should reach for directly. opencode/claude/codex only run
  # inside the engineering container, dispatched via engineering_manager.
  # Fixed 2026-09-19: repo manifests (k8s/company-ops.yaml, k8s/engineering.yaml)
  # were out of sync with the live k3s cluster's actual resource names
  # (Deployment/Service really named `hermes-gateway`/`engineering-agent`,
  # not `company-ops`/`engineering`) — hostname "engineering" never
  # resolved in-cluster (only in docker-compose's network, where the
  # compose service alias happens to be literally "engineering"). Manifests
  # renamed to match live reality; this URL now points at the real Service.
  engineering_manager:
    url: "http://engineering-agent:8000/mcp"
  browser_adversary:
    url: "http://browser-adversary:8000/mcp"
    connect_timeout: 30
    timeout: 900
  # Replaces companyd_deployment (a custom daemon that was never actually
  # reachable — always failed to connect to localhost:8001 — and reimplemented
  # deploy/status/rollback/list_generations/get_logs, every one of which maps
  # directly onto a native K8s primitive). In-cluster auth via the pod's own
  # ServiceAccount token (RBAC: company-ops/k8s/rbac.yaml — read-only on
  # pods/events, patch-only on deployments/replicasets, no delete, no
  # secrets). --disable-destructive is defense in depth on top of that RBAC.
  k8s_deployment:
    command: "npx"
    args: ["-y", "kubernetes-mcp-server@latest", "--disable-destructive", "--log-file", "stderr", "--cluster-provider", "in-cluster"]
    env:
      # MCP command-subprocesses don't inherit the full pod environment —
      # confirmed live: without these, in-cluster auto-detection fails with
      # "in-cluster manager cannot be used outside of a cluster" even though
      # the ServiceAccount token/CA files are present on disk as usual.
      # These two are standard K8s-injected values, stable for the cluster's
      # lifetime (the `kubernetes` Service is always first in the range).
      KUBERNETES_SERVICE_HOST: "10.43.0.1"
      KUBERNETES_SERVICE_PORT: "443"
    connect_timeout: 60
    timeout: 300
  container_manager:
    command: "node"
    args: ["/opt/company-ops/scripts/container-manager-mcp.js"]
    connect_timeout: 30
    timeout: 300
  # Ephemeral Kaniko build+push — see k8s/builder-rbac.yaml for the
  # dedicated ServiceAccount/Role this authenticates as (create/watch/
  # delete Jobs only, never Deployments/Secrets), distinct from the
  # container_manager/k8s_deployment entries above which use the shared
  # "company-ops" SA. connect/timeout are generous because a real build can
  # run for several minutes; builder_build_and_push has its own internal
  # timeout_seconds argument as the primary bound.
  builder_manager:
    command: "node"
    args: ["/opt/company-ops/scripts/builder-manager-mcp.js"]
    connect_timeout: 30
    timeout: 1800

# OpenAI-compatible HTTP API surface (gateway/platforms/api_server.py),
# used by scripts/hermes-messenger-mcp.js so Claude/agent-manager can talk
# to this Hermes instance directly (POST /v1/chat/completions) instead of
# via Discord — Discord was rejected for this because Hermes's own adapter
# ignores messages authored by its own bot identity (self-message filter),
# so a same-token round trip would never surface a reply. host must be
# 0.0.0.0 (not the library default 127.0.0.1) for the new hermes-gateway
# Service (k8s/company-ops.yaml) to reach it from other pods in-namespace;
# it is still not exposed outside the cluster (ClusterIP only, no Ingress).
# API_SERVER_KEY is a new secret — add it to company-ops-secrets before
# applying this config (see .env.example).
platforms:
  api_server:
    enabled: true
    extra:
      key: "${API_SERVER_KEY}"
      host: "0.0.0.0"

# The api_server platform does NOT include user-configured mcp_servers by
# default (hermes_cli.tools_config._get_platform_tools is called with
# include_default_mcp_servers=False for this platform, confirmed by direct
# inspection of the installed package + live evaluation against this exact
# config on 2026-09-20) — a request through /v1/chat/completions otherwise
# resolves to ONLY the static composite toolsets (browser, file, terminal,
# memory, etc.), with none of container_manager/builder_manager/
# k8s_deployment/browser_adversary reachable at all, regardless of RBAC or
# MCP server health. This must be an explicit allowlist entry per platform;
# "hermes-api-server" is the platform's own default composite and must stay
# listed first so opting in these two MCP servers doesn't silently drop it.
# Required for hermes-messenger-mcp.js's hermes_ask to be able to trigger
# container_upgrade/builder_build_and_push at all.
platform_toolsets:
  api_server:
    - hermes-api-server
    - container_manager
    - builder_manager
