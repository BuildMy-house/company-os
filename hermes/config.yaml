# Cron expressions (dream-audit: 0 0,12 * * * = 06:00/18:00 BTT) are UTC.
timezone: UTC

agent:
  # Nous free models regularly answer 429 "at capacity upstream". The default
  # of 3 app-level retries with 30s waits stalled a CEO reply for minutes
  # before reaching the glm-5.3-flash fallback; 1 fails over after one retry.
  api_max_retries: 1
  disabled_toolsets:
    - code_execution
    - file
    - terminal

model:
  # Nous retires its free models by flipping them to paid WITHOUT removing
  # them from /v1/models, so the listing cannot be trusted to pick a
  # replacement. tencent/hy3:free, upstage/solar-pro4:free and
  # meituan/longcat-2.0:free have each gone this way (the last one answers
  # 404 "This model is no longer free" on every call while still listed).
  # Verified 2026-10-12 with a real chat completion, not the listing:
  # poolside/laguna-xs-2.1:free answers 200 with a 1,048,576-token
  # context. It is a preview build, so expect it to be retired the same way;
  # the glm-5.3-flash fallback below keeps Hermes serving when that happens.
  # Baked default only: scripts/entrypoint.sh renders the live-probed free
  # model over this line at every boot (hermes/resolve_model.py), and a 6h /
  # on-failure watcher restarts the pod when the best free model changes.
  default: poolside/laguna-xs-2.1:free
  provider: custom:nous

fallback_providers:
  - provider: custom:zai_coding_plan
    model: glm-5.3-flash

custom_providers:
  - name: zai_coding_plan
    base_url: https://api.z.ai/api/coding/paas/v4
    key_env: ZAI_CODING_PLAN_API_KEY
  - name: nous
    base_url: https://inference-api.nousresearch.com/v1
    key_env: NOUS_API_KEY
    extra_body:
      tags:
        - product=hermes-agent
        - user=hermes-agent
  # TokenRouter stays available as an optional provider (see SOUL.md), but its
  # token has no access to glm-5.3-flash (403), so auxiliary slots use Z.AI.
  - name: tokenrouter
    base_url: https://api.tokenrouter.com/v1
    key_env: TOKENROUTER_API_KEY

auxiliary:
  # Background aux tasks default to provider "auto", which probes native
  # nous/openrouter providers that are unconfigured/unfunded in this
  # deployment — repeated unhealthy-provider churn in gateway logs plus at
  # least one real failure ("Auxiliary title generation failed: HTTP 400...
  # missing tags"). Pin every aux slot (except vision, which needs
  # vision-capable models) to the same Z.AI Coding Plan model the
  # fallback lane uses (TokenRouter 403s on glm-5.3-flash), and set free_only so the OpenRouter fallback
  # can never pick a paid SKU ("PAID lane engaged... may incur real spend").
  free_only: true
  compression:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  skills_hub:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  approval:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  mcp:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  title_generation:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  review:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  triage_specifier:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  kanban_decomposer:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  profile_describer:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  curator:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  monitor:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  memory_query_rewrite:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  tts_audio_tags:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  goal_judge:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  # Live-verification follow-up (2026-09-20): the 14 slots above were an
  # incomplete inventory of real auxiliary task names — grepping
  # call_llm(task=...)/get_*_auxiliary_client(...) call sites across the
  # deployed image found 5 more real aux tasks that were still silently
  # falling through to provider="auto" (nous churn continued live after
  # the first fix landed, confirmed via kubectl logs). Pin these too.
  kanban_estimator:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  moa_reference:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  moa_aggregator:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  background_review:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash
  call:
    provider: custom:zai_coding_plan
    model: glm-5.3-flash

plugins:
  # axiom_usage ships compact token-usage/tool-call metrics to Axiom
  # (dataset bmh-company) — verified this doesn't touch anything else:
  # `hermes plugins list` showed 0/55 bundled plugins in an "enabled" state
  # before this change (Discord, the active model providers, etc. all
  # activate through their own env-var detection, not this generic registry).
  enabled:
    - axiom_usage
    - model_retirement_watch

terminal:
  backend: local

display:
  tool_progress: log
  interim_assistant_messages: false

# Context compression. `threshold` (ratio of the active model's window) is left
# at its default; `threshold_tokens` is Hermes's absolute-token cap and the
# trigger is the LOWER of the two (hermes_cli/config.py: "takes lower of ratio
# vs absolute"; agent/agent_init.py clamps it to the window). Primary model
# poolside/laguna-xs-2.1:free has a ~1.05M window and the glm-5.3-flash fallback
# 1M, so the default 50% ratio would only compact at ~500k tokens; cap it at
# 100k so long CEO sessions compact long before context rot sets in. The
# summariser is auxiliary.compression (glm-5.3-flash, 1M window), so 100k fits.
compression:
  enabled: true
  threshold_tokens: 100000

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 2200
  user_char_limit: 1375
  # Nudge every N user turns to review the conversation for durable facts
  # worth saving with the `memory` tool (0 disables). Was 10; the live
  # MEMORY.md/USER.md stayed ~180 bytes (of 2200/1375 chars), i.e. unused.
  nudge_interval: 5
  # Hindsight (hermes/hindsight/config.json, k8s/base/hindsight): explicit,
  # tools-only long-term memory ALONGSIDE the built-in MEMORY.md/USER.md, which
  # stay enabled above. See README "Hindsight memory".
  provider: hindsight

mcp_servers:
  steward:
    url: "https://buildmyhouse.stewardacs.xyz/mcp/sse"
    transport: sse
    headers:
      Authorization: "Bearer ${STEWARD_TOKEN}"
    connect_timeout: 30
    timeout: 300
  # Official Axiom-hosted MCP (queryApl, listDatasets, getDatasetInfoAndSchema).
  # AXIOM_QUERY_TOKEN is a read-only query credential, deliberately separate
  # from the ingest AXIOM_TOKEN the axiom_usage plugin writes with.
  axiom:
    url: "https://mcp.axiom.co/mcp"
    headers:
      Authorization: "Bearer ${AXIOM_QUERY_TOKEN}"
      x-axiom-org-id: "${AXIOM_ORG_ID}"
    connect_timeout: 30
    timeout: 300
  # Connects as hermes_analytics: SELECT-only, no write access to either
  # the company or observer schema. Production self-hosted Postgres.
  postgres_analytics:
    command: "npx"
    args: ["-y", "@microsoft/postgres-mcp", "run"]
    env:
      POSTGRES_MCP_CONNECTION_STRING: "${ANALYTICS_DATABASE_URL}"
    connect_timeout: 60
    timeout: 900
  # Hermes has a narrow build dispatcher, not the engineering manager MCP;
  # general repository work stays with engineering.
  browser_adversary:
    url: "http://browser-adversary:8000/mcp"
    connect_timeout: 30
    timeout: 900
  # Replaces companyd_deployment (a custom daemon that was never actually
  # reachable — always failed to connect to localhost:8001 — and reimplemented
  # deploy/status/rollback/list_generations/get_logs, every one of which maps
  # directly onto a native K8s primitive). In-cluster auth via the pod's own
  # ServiceAccount token (RBAC: company-ops/k8s/base/core/rbac.yaml — read-only on
  # pods/events, patch-only on deployments/replicasets, no delete, no
  # secrets). --disable-destructive is defense in depth on top of that RBAC.
  # RBAC was extended 2026-10 (k8s/base/core/rbac.yaml) with batch/jobs+cronjobs in
  # company-ops and read-only access to buildmyhouse-dev, specifically so
  # this tool can drive docs/DEV-CLUSTER-GATE.md's runbook (poller
  # status/logs, manual rebuild trigger, buildmyhouse-dev pod/configmap
  # reads). Still no Secrets access anywhere, still --disable-destructive.
  k8s_deployment:
    command: "npx"
    args: ["-y", "kubernetes-mcp-server@0.0.67", "--disable-destructive", "--log-file", "stderr", "--cluster-provider", "in-cluster"]
    env:
      # MCP command-subprocesses don't inherit the full pod environment —
      # confirmed live: without these, in-cluster auto-detection fails with
      # "in-cluster manager cannot be used outside of a cluster" even though
      # the ServiceAccount token/CA files are present on disk as usual.
      # These two are standard K8s-injected values, stable for the cluster's
      # lifetime (the `kubernetes` Service is always first in the range).
      KUBERNETES_SERVICE_HOST: "10.43.0.1"
      KUBERNETES_SERVICE_PORT: "443"
    connect_timeout: 60
    timeout: 300
  # Read-only cluster view for status reports (pods, events, logs in
  # company-ops). --read-only drops every write verb server-side; the shared
  # SA's RBAC still has no Secrets access, so there is no secrets surface.
  # Separate entry from k8s_deployment so exposing it to the api_server
  # platform (CEO chat) does not also expose patch-capable tools.
  k8s_readonly:
    command: "npx"
    args: ["-y", "kubernetes-mcp-server@0.0.67", "--read-only", "--disable-destructive", "--log-file", "stderr", "--cluster-provider", "in-cluster"]
    env:
      KUBERNETES_SERVICE_HOST: "10.43.0.1"
      KUBERNETES_SERVICE_PORT: "443"
    connect_timeout: 60
    timeout: 300
  container_manager:
    command: "node"
    args: ["/opt/company-ops/scripts/container-manager-mcp.js"]
    # Root cause of container_status failing with "Kubernetes API unavailable
    # outside a k3s pod": MCP command-subprocesses do not inherit the pod
    # environment, so KUBERNETES_SERVICE_HOST was unset (the token/CA files
    # were fine). Same workaround as k8s_deployment above.
    env:
      KUBERNETES_SERVICE_HOST: "10.43.0.1"
      KUBERNETES_SERVICE_PORT: "443"
    connect_timeout: 30
    # Allow an engineering rollout plus its automatic rollback to complete.
    timeout: 1800
  # Build requests go to a separate service that accepts only a pinned
  # company-os source SHA; it has no workspace checkout or engineering tool.
  hermes_build_dispatcher:
    url: "http://hermes-build-dispatcher:8000/mcp"
    connect_timeout: 30
    timeout: 1800
  hive_member:
    command: "node"
    args: ["/opt/company-ops/scripts/hive-member-mcp.js"]
    connect_timeout: 30
    timeout: 900

# OpenAI-compatible HTTP API surface (gateway/platforms/api_server.py),
# used by scripts/hermes-messenger-mcp.js so Claude/agent-manager can talk
# to this Hermes instance directly (POST /v1/chat/completions) instead of
# via Discord — Discord was rejected for this because Hermes's own adapter
# ignores messages authored by its own bot identity (self-message filter),
# so a same-token round trip would never surface a reply. host must be
# 0.0.0.0 (not the library default 127.0.0.1) for the new hermes-gateway
# Service (k8s/base/hermes/company-ops.yaml) to reach it from other pods in-namespace;
# it is still not exposed outside the cluster (ClusterIP only, no Ingress).
# API_SERVER_KEY is a new secret — add it to company-ops-secrets before
# applying this config (see .env.example).
platforms:
  api_server:
    enabled: true
    extra:
      key: "${API_SERVER_KEY}"
      host: "0.0.0.0"

# The api_server platform does NOT include user-configured mcp_servers by
# default (hermes_cli.tools_config._get_platform_tools is called with
# include_default_mcp_servers=False for this platform, confirmed by direct
# inspection of the installed package + live evaluation against this exact
# config on 2026-09-20) — a request through /v1/chat/completions otherwise
# resolves to ONLY the static composite toolsets (browser, file, terminal,
# memory, etc.), with none of container_manager/hermes_build_dispatcher/
# k8s_deployment/browser_adversary reachable at all, regardless of RBAC or
# MCP server health. This must be an explicit allowlist entry per platform;
# "hermes-api-server" is the platform's own default composite and must stay
# listed first so opting in additional MCP servers doesn't silently drop it.
# Explicitly expose a build-only dispatcher; the engineering manager remains
# private to engineering and Hermes cannot dispatch general repository work.
platform_toolsets:
  api_server:
    - hermes-api-server
    - container_manager
    - k8s_readonly
    - hermes_build_dispatcher
    - hive_member
