model:
  default: tencent/hy3:free
  provider: custom:nous

custom_providers:
  - name: nous
    base_url: https://inference-api.nousresearch.com/v1
    key_env: NOUS_API_KEY
    extra_body:
      tags:
        - product=hermes-agent
        - user=hermes-agent

terminal:
  backend: local

display:
  tool_progress: log
  interim_assistant_messages: false

mcp_servers:
  # Placeholder — inactive until a real pgEdge account/API key exists.
  # See company-ops/NAHAR-TODO.md for the setup steps. Do not remove this
  # comment when filling in real credentials later — replace it with a
  # short note that it's now live instead.
  # Connects as hermes_analytics: SELECT-only, no write access to either
  # the company or observer schema.
  # Package name below (@pgedge/mcp-server) is unverified — confirm the
  # real published package before going live.
  pgedge_analytics:
    command: "npx"
    args: ["-y", "@pgedge/mcp-server"]
    env:
      PGEDGE_API_KEY: "${PGEDGE_API_KEY}"
      ANALYTICS_DATABASE_URL: "${ANALYTICS_DATABASE_URL}"
    connect_timeout: 60
    timeout: 900
  opencode_manager:
    command: "npx"
    args: ["-y", "@kud/mcp-opencode"]
    env:
      OPENCODE_CONFIG_DIR: "/opt/homely-ceo/shared"
      OPENCODE_DOMAINS_DIR: "/opt/homely-ceo/domains"
      PATH: "/root/.hermes/tools/opencode/node_modules/.bin:/usr/local/bin:/usr/bin:/bin"
    connect_timeout: 60
    timeout: 900
