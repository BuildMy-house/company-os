model:
  default: z-ai/glm-5.3-free
  provider: custom:tokenrouter

custom_providers:
  - name: nous
    base_url: https://inference-api.nousresearch.com/v1
    key_env: NOUS_API_KEY
    extra_body:
      tags:
        - product=hermes-agent
        - user=hermes-agent
  # Default provider: Nous's free tencent/hy3:free model was discontinued
  # ("This model's free period has ended") and NOUS_API_KEY was never
  # provisioned anyway. TokenRouter is already a working, funded free-tier
  # provider used elsewhere in this project (opencode.json, engineering
  # container) — reusing it here instead of leaving Hermes with no working
  # default model.
  - name: tokenrouter
    base_url: https://api.tokenrouter.com/v1
    key_env: TOKENROUTER_API_KEY

terminal:
  backend: local

display:
  tool_progress: log
  interim_assistant_messages: false

mcp_servers:
  # Connects as hermes_analytics: SELECT-only, no write access to either
  # the company or observer schema. Production self-hosted Postgres.
  postgres_analytics:
    command: "npx"
    args: ["-y", "@microsoft/postgres-mcp", "run"]
    env:
      POSTGRES_MCP_CONNECTION_STRING: "${ANALYTICS_DATABASE_URL}"
    connect_timeout: 60
    timeout: 900
  # opencode_manager removed: it never worked (pointed at nonexistent
  # /opt/homely-ceo/* config dirs) and per SOUL.md was only ever "the
  # older" fallback for when engineering_manager is down — not something
  # Hermes should reach for directly. opencode/claude/codex only run
  # inside the engineering container, dispatched via engineering_manager.
  # URL shape inferred; confirm against the installed hermes binary before production use.
  engineering_manager:
    url: "http://engineering:8000/mcp"
  companyd_deployment:
    url: "http://localhost:8001/mcp"
    description: "Autonomous multi-generation deployment orchestration"
