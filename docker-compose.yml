services:
  company-ops:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/house_designer
    environment:
      - INFISICAL_UNIVERSAL_AUTH_CLIENT_ID=${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}
      - INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET=${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}
      - INFISICAL_HOST_URL=${INFISICAL_HOST_URL}
      - NOUS_API_KEY=${NOUS_API_KEY}
      - TOKENROUTER_API_KEY=${TOKENROUTER_API_KEY}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
      - ZAI_CODING_PLAN_API_KEY=${ZAI_CODING_PLAN_API_KEY}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - COMPANY_PASSWORD=${COMPANY_PASSWORD}
      - OBSERVER_PASSWORD=${OBSERVER_PASSWORD}
      - ANALYTICS_PASSWORD=${ANALYTICS_PASSWORD}
      - COMPANY_DATABASE_URL=${COMPANY_DATABASE_URL}
      - OBSERVER_DATABASE_URL=${OBSERVER_DATABASE_URL}
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_ALLOWED_USERS=${DISCORD_ALLOWED_USERS}
      - DISCORD_ALLOWED_CHANNELS=${DISCORD_ALLOWED_CHANNELS}
      - DISCORD_ALLOW_ALL_USERS=${DISCORD_ALLOW_ALL_USERS}
      - DISCORD_ANNOUNCE_CHANNEL=${DISCORD_ANNOUNCE_CHANNEL}
      - DISCORD_HIL_CHANNEL=${DISCORD_HIL_CHANNEL}
      - DISCORD_FINANCE_CHANNEL=${DISCORD_FINANCE_CHANNEL}
      - DISCORD_DM_USER=${DISCORD_DM_USER}
      - STEWARD_TOKEN=${STEWARD_TOKEN}
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: true
    volumes:
      - ..:/workspace/house_designer
      - hermes-data:/opt/data
      - ../certs/homely-deploy:/root/.ssh/id_rsa:ro
    command: ["hermes", "gateway", "run"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homely_company
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../company-ops/sql/company_schema.sql:/docker-entrypoint-initdb.d/01-company_schema.sql:ro
      - ../company-ops/sql/observer_schema.sql:/docker-entrypoint-initdb.d/02-observer_schema.sql:ro
      - ../company-ops/sql/roles.sql:/docker-entrypoint-initdb.d/03-roles.sql:ro
      - ../company-ops/scripts/04-set-role-passwords.sh:/docker-entrypoint-initdb.d/04-set-role-passwords.sh:ro
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homely_company"]
      interval: 10s
      timeout: 5s
      retries: 5

  engineering:
    build:
      context: .
      dockerfile: Dockerfile.engineering
      additional_contexts:
        manager-def: ../.claude/agents
        skills-src: ../.agents/skills
    working_dir: /workspace/app-checkout
    environment:
      - GITHUB_APP_ID=4857525
      - GITHUB_APP_INSTALLATION_ID=159686448
      - GITHUB_APP_PRIVATE_KEY_PATH=/etc/github/buildmyhouse-engineering-app.pem
      - APP_REPO_URL=https://github.com/BuildMy-house/app.git
      - WEBSITE_REPO_URL=https://github.com/BuildMy-house/website.git
      - COMPANY_OS_REPO_URL=https://github.com/BuildMy-house/company-os.git
      - HERMEES_REPO_URL=https://github.com/BuildMy-house/hermees.git
      - OBSERVER_WEBSITE_REPO_URL=https://github.com/BuildMy-house/observer-website.git
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - CODEX_API_KEY=${CODEX_API_KEY}
      - CODEX_ACCESS_TOKEN=${CODEX_ACCESS_TOKEN}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - TOKENROUTER_API_KEY=${TOKENROUTER_API_KEY}
      - AXIOM_TOKEN=${AXIOM_TOKEN}
      - AXIOM_ORG_ID=${AXIOM_ORG_ID}
      - AXIOM_ENDPOINT=${AXIOM_ENDPOINT}
      - NEON_API_KEY=${NEON_API_KEY}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - INFISICAL_UNIVERSAL_AUTH_CLIENT_ID=${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}
      - INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET=${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}
      - INFISICAL_HOST_URL=${INFISICAL_HOST_URL}
      - STEWARD_TOKEN=${STEWARD_TOKEN}
      - STEWARD_URL=${STEWARD_URL}
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: true
    volumes:
      - engineering-checkout:/workspace/app-checkout
      - website-checkout:/workspace/website-checkout
      - company-os-checkout:/workspace/company-os-checkout
      - hermees-checkout:/workspace/hermees-checkout
      - observer-website-checkout:/workspace/observer-website-checkout
      # GitHub App .pem intentionally not mounted for this smoke test: the
      # BuildMy-house repos are public, so unauthenticated clone is enough,
      # and the key material lives in Infisical (GITHUB_APP_PRIVATE_KEY)
      # rather than on disk here.
      # Optional: bind-mount host's ai-cli config for persistence
      - ~/.config/ai-cli:/root/.config/ai-cli
    expose:
      - "8000"
    entrypoint: ["bash", "/opt/company-ops/scripts/engineering-entrypoint.sh"]

volumes:
  hermes-data:
  engineering-checkout:
  website-checkout:
  company-os-checkout:
  hermees-checkout:
  observer-website-checkout:
  postgres-data:
