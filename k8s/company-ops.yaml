apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-gateway
  namespace: company-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-gateway
  template:
    metadata:
      labels:
        app: hermes-gateway
    spec:
      serviceAccountName: company-ops
      containers:
        - name: hermes-gateway
          image: localhost:30500/company-os@sha256:cd30efaface35d067880c44fce64bf856953e730a059511d20a53b8a77e4ab45
          imagePullPolicy: Always
          command: ["env", "-u", "GITHUB_APP_PRIVATE_KEY", "-u", "GITHUB_APP_PRIVATE_KEY_PATH", "-u", "GITHUB_APP_ID", "-u", "GITHUB_APP_INSTALLATION_ID", "-u", "GITHUB_TOKEN", "-u", "GH_TOKEN", "bash", "/opt/company-ops/scripts/entrypoint.sh", "hermes", "gateway", "run"]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          envFrom:
            - secretRef:
                name: company-ops-secrets
          env:
            - name: HIVE_URL
              value: http://hive-coordinator:4100
            - name: HIVE_AGENT_ID
              value: hermees
            - name: AXIOM_SERVICE_NAME
              value: hermes-gateway-k8s
            - name: DEPLOYMENT_ENVIRONMENT
              value: local-k8s
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "hermes"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "hermes"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: company-ops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
# ClusterIP only — the api_server platform (hermes/config.yaml) binds an
# OpenAI-compatible HTTP surface (/v1/chat/completions etc, port 8642)
# authenticated by API_SERVER_KEY; this Service makes it reachable from
# other in-namespace pods (engineering-agent) without exposing it outside
# the cluster. No NodePort — unlike registry.yaml's deliberately-external
# NodePort, there is no reason for this to leave company-ops.
apiVersion: v1
kind: Service
metadata:
  name: hermes-gateway
  namespace: company-ops
spec:
  selector:
    app: hermes-gateway
  ports:
    - port: 8642
      targetPort: 8642
