apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-gateway
  namespace: company-ops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hermes-gateway
  template:
    metadata:
      labels:
        app: hermes-gateway
    spec:
      serviceAccountName: company-ops
      containers:
        - name: hermes-gateway
          image: docker.io/library/company-os:container-manager
          imagePullPolicy: IfNotPresent
          command: ["bash", "/opt/company-ops/scripts/entrypoint.sh", "hermes", "gateway", "run"]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          envFrom:
            - secretRef:
                name: company-ops-secrets
          env:
            - name: AXIOM_SERVICE_NAME
              value: hermes-gateway-k8s
            - name: DEPLOYMENT_ENVIRONMENT
              value: local-k8s
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "hermes"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "hermes"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: company-ops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
