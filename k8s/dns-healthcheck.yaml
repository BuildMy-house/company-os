# DNS healthcheck: CronJob + its least-privilege RBAC, all in one file
# because every object here exists only for this one job.
#
# Detects the 2026-09-28 incident class: CoreDNS keeps forwarding external
# queries to a stale/dead upstream from its cached /etc/resolv.conf, which
# breaks ALL external DNS cluster-wide while looking like a single service's
# bug (hermes-gateway's Discord adapter crash-looping on
# ClientConnectorDNSError). company_ops/dns_healthcheck.py greps coredns's
# logs for repeating `[ERROR] plugin/errors: ... i/o timeout` /
# `dial udp [..]:53: connect: invalid argument` lines against the same
# upstream and opens a Steward task with the evidence + one-line fix.
#
# Least-privilege scope, deliberately:
#   * Role `dns-healthcheck-reader` (kube-system) grants ONLY get/list on
#     `pods` + `pods/log` — enough to read coredns's logs once per run.
#     No `watch` (it polls, it does not watch), no write verbs, no other
#     resources, and NO `apps` rules at all: this ServiceAccount CANNOT
#     patch/restart the coredns Deployment.
#   * Remediation is intentionally NOT wired to auto-execute — this job is
#     detect + ticket only, because auto-remediation needs a separate
#     sign-off on approach (it is not a default to ship now). The created
#     Steward task's description carries
#     `kubectl rollout restart deployment/coredns -n kube-system` for a
#     human or an already-privileged agent (e.g. Hermes via its
#     k8s_deployment MCP) to run.
#   * Its own ServiceAccount (`dns-healthcheck`, company-ops) rather than the
#     existing `company-ops` one from k8s/rbac.yaml — that Role is scoped to
#     the company-ops namespace only, and this job reads kube-system.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-healthcheck
  namespace: company-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dns-healthcheck-reader
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dns-healthcheck-reader
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: dns-healthcheck
    namespace: company-ops
roleRef:
  kind: Role
  name: dns-healthcheck-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dns-healthcheck
  namespace: company-ops
spec:
  # Every 15m: catches a stale-DNS incident within one poll window without
  # being noisy on a healthy cluster (clean runs exit 0 silently).
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: dns-healthcheck
          containers:
            - name: dns-healthcheck
              image: docker.io/library/company-ops-company-ops:latest
              imagePullPolicy: IfNotPresent
              command: ["/opt/company-ops-venv/bin/python", "-m", "company_ops.dns_healthcheck"]
              # STEWARD_TOKEN / STEWARD_URL (+ STEWARD_MCP_URL if renamed)
              # arrive via company-ops-secrets; synced from Infisical /infra
              # ("Steward") by k8s/infisical-sync.yaml.
              envFrom:
                - secretRef:
                    name: company-ops-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
