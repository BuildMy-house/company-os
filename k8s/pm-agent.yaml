apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm-agent
  namespace: company-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pm-agent
  template:
    metadata:
      labels:
        app: pm-agent
    spec:
      containers:
        - name: pm-agent
          image: localhost:30500/company-os-pm-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4200
          env:
            - name: PORT
              value: "4200"
            - name: HIVE_URL
              value: http://hive-coordinator:4100
          envFrom:
            - secretRef:
                name: company-ops-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4200
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4200
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pm-agent
  namespace: company-ops
spec:
  selector:
    app: pm-agent
  ports:
    - port: 4200
      targetPort: 4200
