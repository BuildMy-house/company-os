apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: company-ops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: company-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: homely_company
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: company-ops-secrets
                  key: POSTGRES_PASSWORD
            - name: COMPANY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: company-ops-secrets
                  key: COMPANY_PASSWORD
            - name: OBSERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: company-ops-secrets
                  key: OBSERVER_PASSWORD
            - name: ANALYTICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: company-ops-secrets
                  key: ANALYTICS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "homely_company"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "homely_company"]
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: company-ops
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
