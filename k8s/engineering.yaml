apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-agent
  namespace: company-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: engineering-agent
  template:
    metadata:
      labels:
        app: engineering-agent
    spec:
      serviceAccountName: company-ops
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: engineering-agent
          image: docker.io/library/company-os-engineering:container-manager
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          env:
            - name: HOME
              value: /tmp/company-ops-home
            - name: AXIOM_SERVICE_NAME
              value: engineering-k8s
            - name: DEPLOYMENT_ENVIRONMENT
              value: local-k8s
            - name: CODEX_HOME
              value: /tmp/company-ops-home/.codex
            - name: KUBERNETES_SERVICE_HOST
              value: "10.43.0.1"
            - name: KUBERNETES_SERVICE_PORT
              value: "443"
            - name: XDG_CONFIG_HOME
              value: /tmp/company-ops-home/.config
            - name: GITHUB_APP_ID
              value: "4857525"
            - name: GITHUB_APP_INSTALLATION_ID
              value: "159686448"
            - name: APP_REPO_URL
              value: "https://github.com/BuildMy-house/app.git"
            - name: WEBSITE_REPO_URL
              value: "https://github.com/BuildMy-house/website.git"
            - name: COMPANY_OS_REPO_URL
              value: "https://github.com/BuildMy-house/company-os.git"
            - name: HERMEES_REPO_URL
              value: "https://github.com/BuildMy-house/hermees-diary.git"
            - name: OBSERVER_WEBSITE_REPO_URL
              value: "https://github.com/BuildMy-house/observer-website.git"
          envFrom:
            - secretRef:
                name: company-ops-secrets
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: agent-home
              mountPath: /tmp/company-ops-home
      volumes:
        - name: agent-home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: engineering-agent
  namespace: company-ops
spec:
  selector:
    app: engineering-agent
  ports:
    - port: 8000
      targetPort: 8000
