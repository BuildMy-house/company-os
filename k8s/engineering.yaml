apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering
  namespace: company-ops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: engineering
  template:
    metadata:
      labels:
        app: engineering
    spec:
      containers:
        - name: engineering
          image: docker.io/library/company-ops-engineering:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          env:
            - name: GITHUB_APP_ID
              value: "4857525"
            - name: GITHUB_APP_INSTALLATION_ID
              value: "159686448"
            - name: APP_REPO_URL
              value: "https://github.com/BuildMy-house/app.git"
            - name: WEBSITE_REPO_URL
              value: "https://github.com/BuildMy-house/website.git"
            - name: COMPANY_OS_REPO_URL
              value: "https://github.com/BuildMy-house/company-os.git"
            - name: HERMEES_REPO_URL
              value: "https://github.com/BuildMy-house/hermees.git"
            - name: OBSERVER_WEBSITE_REPO_URL
              value: "https://github.com/BuildMy-house/observer-website.git"
          envFrom:
            - secretRef:
                name: company-ops-secrets
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: engineering
  namespace: company-ops
spec:
  selector:
    app: engineering
  ports:
    - port: 8000
      targetPort: 8000
