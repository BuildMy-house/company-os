apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-opencode
  namespace: company-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: engineering-opencode
  template:
    metadata:
      labels:
        app: engineering-opencode
    spec:
      serviceAccountName: company-ops
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: engineering-opencode
          image: localhost:30500/company-os-engineering@sha256:98fdfc2a3eccdc5586f9a3dd602f409fb5b508d9f7a1f1444ce3460a1bf9a2d4
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8000
            - containerPort: 8001
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          env:
            - name: HOME
              value: /tmp/company-ops-home
            - name: AXIOM_SERVICE_NAME
              value: engineering-opencode-k8s
            - name: DEPLOYMENT_ENVIRONMENT
              value: local-k8s
            - name: HIVE_URL
              value: http://hive-coordinator:4100
            - name: HIVE_AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: A2A_ENDPOINT
              value: http://engineering-opencode:8001
            - name: AGENT_FLAVOR
              value: opencode
            - name: AGENT_ROLE
              value: manager
            - name: AGENT_PROFILE
              value: generalist
            - name: AGENT_CAPABILITIES
              value: execute,review
            - name: RUNNER_AGENT
              value: opencode
            - name: RUNNER_MODEL
              value: tokenrouter/z-ai/glm-5.3-free
            - name: CODEX_HOME
              value: /tmp/company-ops-home/.codex
            - name: KUBERNETES_SERVICE_HOST
              value: "10.43.0.1"
            - name: KUBERNETES_SERVICE_PORT
              value: "443"
            - name: XDG_CONFIG_HOME
              value: /tmp/company-ops-home/.config
            - name: GITHUB_APP_ID
              value: "4857525"
            - name: GITHUB_APP_INSTALLATION_ID
              value: "159686448"
            - name: APP_REPO_URL
              value: "https://github.com/BuildMy-house/app.git"
            - name: WEBSITE_REPO_URL
              value: "https://github.com/BuildMy-house/website.git"
            - name: COMPANY_OS_REPO_URL
              value: "https://github.com/BuildMy-house/company-os.git"
            - name: HERMEES_REPO_URL
              value: "https://github.com/BuildMy-house/hermees-diary.git"
            - name: OBSERVER_WEBSITE_REPO_URL
              value: "https://github.com/BuildMy-house/observer-website.git"
          envFrom:
            - secretRef:
                name: company-ops-secrets
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: agent-home
              mountPath: /tmp/company-ops-home
            - name: builder-manager-token
              mountPath: /var/run/secrets/builder-manager
              readOnly: true
      volumes:
        - name: agent-home
          emptyDir: {}
        - name: builder-manager-token
          secret:
            secretName: builder-manager-token
---
apiVersion: v1
kind: Service
metadata:
  name: engineering-opencode
  namespace: company-ops
spec:
  selector:
    app: engineering-opencode
  ports:
    - name: mcp
      port: 8000
      targetPort: 8000
    - name: a2a
      port: 8001
      targetPort: 8001
