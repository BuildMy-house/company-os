# Engineering image builds run here so upgrading an engineering worker cannot
# terminate the BuildKit MCP call that produced its replacement image.
# This workload uses the build-only ServiceAccount and cannot patch Deployments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-build-dispatcher
  namespace: company-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engineering-build-dispatcher
  template:
    metadata:
      labels:
        app: engineering-build-dispatcher
    spec:
      serviceAccountName: builder-manager
      automountServiceAccountToken: false
      containers:
        - name: engineering-build-dispatcher
          image: localhost:30500/company-os-engineering@sha256:bfb11c5a7f782001e4a4ccd25fb7a99e31d15db02f3f89d055f5af52d528e119
          imagePullPolicy: Always
          command: ["npx", "-y", "mcp-proxy", "--host", "127.0.0.1", "--port", "8000", "--requestTimeout", "3600000", "--", "env", "BUILDER_SCOPE=engineering", "node", "/opt/company-ops/scripts/builder-manager-mcp.js"]
          env:
            - name: BUILDER_MANAGER_CA_PATH
              value: /var/run/secrets/builder-manager/ca.crt
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: company-ops-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: company-ops-secrets
                  key: GITHUB_APP_INSTALLATION_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: company-ops-secrets
                  key: GITHUB_APP_PRIVATE_KEY
          readinessProbe:
            exec:
              command: ["node", "-e", "const net=require('node:net');const s=net.connect(8000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["node", "-e", "const net=require('node:net');const s=net.connect(8000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: builder-manager-token
              mountPath: /var/run/secrets/builder-manager
              readOnly: true
      volumes:
        - name: builder-manager-token
          secret:
            secretName: builder-manager-token
