apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-data-backup
  namespace: company-ops
spec:
  # Runs 30 min after the postgres backup so the two jobs never contend.
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              # Same image as the app + postgres backup (single source of truth:
              # k8s/company-ops.yaml). Contains python + boto3; no shell S3 tooling.
              image: localhost:30500/company-os@sha256:3362facae774c734e7fffc74bee535710072e80c504d23f8cb8cbfcc1e6d5e3d
              imagePullPolicy: Always
              command:
                - /opt/company-ops-venv/bin/python
                - -m
                - company_ops.backup
                - --hermes-data
                - /mnt/hermes-data
              envFrom:
                - secretRef:
                    name: company-ops-secrets
              volumeMounts:
                - name: hermes-data
                  mountPath: /mnt/hermes-data
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: hermes-data
              persistentVolumeClaim:
                claimName: hermes-data
                readOnly: true
          # hermes-data is RWO: the backup pod must schedule on the same node
          # as the hermes-gateway pod. Fine on the current single-node k3s;
          # revisit (RWX volume or snapshot-based backup) before multi-node.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - hermes-gateway
                  topologyKey: kubernetes.io/hostname
