apiVersion: apps/v1
kind: Deployment
metadata:
  name: smashlock-reviewer
  namespace: company-ops
  labels:
    app: smashlock-reviewer
    repos: smashlock
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smashlock-reviewer
  template:
    metadata:
      labels:
        app: smashlock-reviewer
        repos: smashlock
    spec:
      serviceAccountName: company-ops
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: smashlock-reviewer
          image: localhost:30500/company-os-engineering:ticket-std-714c938@sha256:24d6efe3f75630b250045e482af3dbf20156d42dddf70b58c6ab7c46a73f27ed
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8000
            - containerPort: 8001
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 3Gi
          env:
            - name: HOME
              value: /tmp/company-ops-home
            - name: AXIOM_SERVICE_NAME
              value: smashlock-reviewer-k8s
            - name: DEPLOYMENT_ENVIRONMENT
              value: local-k8s
            - name: HIVE_URL
              value: http://hive-coordinator:4100
            - name: HIVE_AGENT_ID
              value: smashlock-reviewer
            - name: A2A_ENDPOINT
              value: http://smashlock-reviewer:8001
            - name: AGENT_FLAVOR
              value: opencode
            - name: AGENT_ROLE
              value: worker
            - name: AGENT_PROFILE
              value: reviewer
            - name: AGENT_CAPABILITIES
              value: review
            - name: AGENT_TIER
              value: cheap
            - name: AGENT_COST_FACTOR
              value: "0.1"
            - name: AGENT_REPOS
              value: smashlock
            - name: RUNNER_AGENT
              value: opencode
            # TokenRouter first per workspace policy; if it returns 503, switch to oc-opencode/mimo-v2.6-flash-free (as engineering-opencode does)
            - name: RUNNER_MODEL
              value: oc-tokenrouter/z-ai/glm-5.3-free
            - name: CODEX_HOME
              value: /tmp/company-ops-home/.codex
            - name: KUBERNETES_SERVICE_HOST
              value: "10.43.0.1"
            - name: KUBERNETES_SERVICE_PORT
              value: "443"
            - name: XDG_CONFIG_HOME
              value: /tmp/company-ops-home/.config
            - name: GITHUB_APP_ID
              value: "4857525"
            - name: GITHUB_APP_INSTALLATION_ID
              value: "159686448"
            - name: SMASHLOCK_REPO_URL
              value: "https://github.com/BuildMy-house/SmashLock.git"
          envFrom:
            - secretRef:
                name: company-ops-secrets
            - secretRef:
                name: company-ops-steward-smashlock-opencode
            - secretRef:
                name: smashlock-secrets
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: agent-home
              mountPath: /tmp/company-ops-home
      volumes:
        - name: agent-home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: smashlock-reviewer
  namespace: company-ops
spec:
  selector:
    app: smashlock-reviewer
  ports:
    - name: mcp
      port: 8000
      targetPort: 8000
    - name: a2a
      port: 8001
      targetPort: 8001