apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: company-ops
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: localhost:30500/company-os@sha256:527382b201dd815d5d25eccd8f9e7bb20c20eee12ebc4063d760bfa98c8dac78
              imagePullPolicy: Always
              command: ["/opt/company-ops-venv/bin/python", "-m", "company_ops.backup"]
              envFrom:
                - secretRef:
                    name: company-ops-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
