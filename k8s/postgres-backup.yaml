apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: company-ops
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: localhost:30500/company-os@sha256:89b92c0be5cc05aa23d10043c89a5dcb3de6a925783f33321952985d8d761b4b
              imagePullPolicy: Always
              command: ["/opt/company-ops-venv/bin/python", "-m", "company_ops.backup"]
              envFrom:
                - secretRef:
                    name: company-ops-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
