# Syncs the Infisical folder /log-shipper into its OWN Secret, log-shipper-secrets.
# The folder must contain exactly one secret:
#   AXIOM_LOG_TOKEN   ingest-only Axiom API token scoped to the container-logs dataset
# Only the log-shipper pod mounts it. No application pod needs Axiom credentials
# to have its stdout/stderr captured. The value is not committed here.
# Uses the existing infisical-auth in company-ops (k8s/base/infisical-sync/infisical-sync.yaml).
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: log-shipper-sync
  namespace: company-ops
spec:
  infisicalAuthRef:
    name: infisical-auth
    namespace: company-ops
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "8806c2b0-73d2-4bea-8537-5b874c5ff592"
      environmentSlug: dev
      secretPath: /log-shipper
  targets:
    - name: log-shipper-secrets
      namespace: company-ops
      kind: Secret
      creationPolicy: Owner
