# Hindsight memory server for Hermes (plugin mode local_external).
# Separate Deployment because the hermes-gateway pod limit is 2Gi and the
# server loads local embedding + reranker models. Reached in-cluster only at
# http://hindsight:8888 (ClusterIP, no Ingress).
#
# The LLM (retain, consolidation, reflect - all three fall back to the global
# HINDSIGHT_API_LLM_* values, no per-operation override is set) is Z.AI Coding
# Plan glm-5.3-flash over its OpenAI-compatible endpoint: the same base URL,
# model and key Hermes already uses for `custom:zai_coding_plan`
# (hermes/config.yaml). glm-5.3-flash is a reasoning model, so the timeout is
# raised and concurrency capped to stay inside the plan's rate limits.
# No credentials here: keys come from company-ops-secrets (Infisical sync):
#   ZAI_CODING_PLAN_API_KEY (/infra)   - already used by Hermes and OpenCode
#   HINDSIGHT_API_KEY  (/hermes)       - NEW: shared bearer token, plugin <-> server
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-data
  namespace: company-ops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: company-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hindsight
  template:
    metadata:
      labels:
        app: hindsight
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # fsGroup makes the volume group-writable on every mount; Postgres
        # refuses to start on a data dir wider than 0750 ("invalid
        # permissions"), which left the pod crash-looping before it opened
        # port 8888. Re-tighten it before the server starts.
        - name: pgdata-perms
          image: ghcr.io/vectorize-io/hindsight-api:0.10.3@sha256:f80f304db313cbc8775acd601fda7d094f5854ebf9bc252d8134eb9276d56b40
          command:
            - sh
            - -c
            - 'd=/home/hindsight/.pg0/instances/hindsight/data; [ ! -d "$d" ] || chmod 0700 "$d"'
          volumeMounts:
            - name: data
              mountPath: /home/hindsight/.pg0
      containers:
        - name: hindsight
          image: ghcr.io/vectorize-io/hindsight-api:0.10.3@sha256:f80f304db313cbc8775acd601fda7d094f5854ebf9bc252d8134eb9276d56b40
          ports:
            - containerPort: 8888
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          env:
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: openai
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: https://api.z.ai/api/coding/paas/v4
            - name: HINDSIGHT_API_LLM_MODEL
              value: glm-5.3-flash
            - name: HINDSIGHT_API_LLM_TIMEOUT
              value: "180"
            - name: HINDSIGHT_API_LLM_MAX_CONCURRENT
              value: "2"
            - name: HINDSIGHT_API_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: company-ops-secrets
                  key: ZAI_CODING_PLAN_API_KEY
            - name: HINDSIGHT_API_TENANT_EXTENSION
              value: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
            - name: HINDSIGHT_API_TENANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: company-ops-secrets
                  key: HINDSIGHT_API_KEY
            - name: HINDSIGHT_API_RETAIN_EXTRACTION_MODE
              value: verbatim
            - name: HINDSIGHT_API_ENABLE_OBSERVATIONS
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /home/hindsight/.pg0
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health/live
              port: 8888
            periodSeconds: 10
            failureThreshold: 60   # first start downloads embedding models
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8888
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hindsight
  namespace: company-ops
spec:
  selector:
    app: hindsight
  ports:
    - port: 8888
      targetPort: 8888
