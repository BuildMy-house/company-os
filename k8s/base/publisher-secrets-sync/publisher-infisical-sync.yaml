# Syncs the Infisical folder /publisher (project "Build My house", environment dev)
# into its OWN Secret, publisher-secrets, in company-ops. Every key in the folder is
# copied, so the folder must contain exactly the keys below (manual
# invariant; no test can see Infisical):
#   GITHUB_TOKEN            fine-grained PAT, exactly the 3 site repos (website, hermees-diary, observer-website), contents:write + pull_requests:write
#   REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET, REDDIT_USERNAME, REDDIT_PASSWORD   publish account
#   PUBLISHER_DATABASE_URL  DSN for publisher_reader (SELECT only on marketing)
#   HINDSIGHT_API_KEY       shared Hindsight key (bank separation is by name only)
# Uses the existing infisical-auth in company-ops (k8s/base/infisical-sync/infisical-sync.yaml),
# same mechanism as k8s/base/pm-agent-secrets-sync. No value is committed here.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: publisher-sync
  namespace: company-ops
spec:
  infisicalAuthRef:
    name: infisical-auth
    namespace: company-ops
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: "8806c2b0-73d2-4bea-8537-5b874c5ff592"
      environmentSlug: dev
      secretPath: /publisher
  targets:
    - name: publisher-secrets
      namespace: company-ops
      kind: Secret
      creationPolicy: Owner
