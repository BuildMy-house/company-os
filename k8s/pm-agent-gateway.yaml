# Authenticated front door for pm-agent, reachable from the app's prod server
# over Tailscale at http://<node-tailnet-ip>:30420. pm-agent itself does not
# check credentials, so this nginx container requires
# "Authorization: Bearer $PM_AGENT_AUTH_TOKEN" (the app's chat relay already
# sends it) and proxies to the ClusterIP service. Logs go to stdout.
# Fails closed: if PM_AGENT_AUTH_TOKEN is missing from company-ops-secrets the
# pod stays in CreateContainerConfigError instead of serving unauthenticated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pm-agent-gateway-config
  namespace: company-ops
data:
  default.conf.template: |
    server {
      listen 8080;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location / {
        if ($http_authorization != "Bearer ${PM_AGENT_AUTH_TOKEN}") { return 401; }
        proxy_pass http://pm-agent:4200;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm-agent-gateway
  namespace: company-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pm-agent-gateway
  template:
    metadata:
      labels:
        app: pm-agent-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          env:
            - name: PM_AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: company-ops-secrets
                  key: PM_AGENT_AUTH_TOKEN
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: config
          configMap:
            name: pm-agent-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: pm-agent-gateway
  namespace: company-ops
spec:
  type: NodePort
  selector:
    app: pm-agent-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30420
