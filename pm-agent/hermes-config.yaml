# Hermes runtime configuration for pm-agent. Rendered to $HERMES_HOME/config.yaml
# by pm-agent/entrypoint.sh (model.default replaced by resolve_model.py). Deliberately NOT derived from hermes/config.yaml:
# nothing here is inherited from Hermes (the CEO agent), and every capability
# is opt-in. Review docs/PM-AGENT-HERMES.md before widening anything.
agent:
  # The pm-agent only classifies feedback and calls two tools: low reasoning
  # (replies took 15-30s). Hermes sends this as top-level reasoning_effort; do NOT
  # also set extra_body.reasoning (Nous 400s on the conflict). resolve_model.py
  # probes with the same value (REASONING_EXTRA_BODY).
  reasoning_effort: low
  # Belt and braces: the api_server platform below also lists exactly one
  # toolset, so none of these can be reached anyway.
  disabled_toolsets:
    - code_execution
    - file
    - terminal
    - web
    - browser
    - vision
    - image_gen
    - tts
    - skills
    - memory
    - session_search
    - delegation
    - cronjob
    - messaging
    - clarify
    - todo

model:
  # Baked default only: entrypoint.sh renders the live-probed free model over
  # this line at boot (pm-agent/resolve_model.py).
  default: inclusionai/ling-3.1-flash
  provider: custom:pm_llm
  # Hermes REJECTS any window below its 64,000-token minimum
  # (MINIMUM_CONTEXT_LENGTH; agent_init raises ValueError -> every chat 500s),
  # so this must stay >= 64000 and must not exceed the model's real window.
  # 64000 is the context cap; compression.threshold_tokens below makes
  # compaction fire before it fills, and the front door enforces a prompt
  # budget (guard.MAX_PROMPT_CHARS).
  context_length: 64000

custom_providers:
  # Nous inference API, same provider as the Hermes runtime default. One
  # key only: PM_AGENT_LLM_API_KEY from pm-agent-secrets (not NOUS_API_KEY
  # from company-ops-secrets). Nous rejects requests without tags (HTTP 400).
  - name: pm_llm
    base_url: https://inference-api.nousresearch.com/v1
    key_env: PM_AGENT_LLM_API_KEY
    extra_body:
      tags:
        - product=hermes-agent
        - user=pm-agent

# No auxiliary models, no plugins (the axiom_usage plugin is NOT enabled:
# telemetry is structured stdout logs only), no memory across users.
plugins:
  enabled: []

memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0

# Nothing is learned or carried between conversations or users: no skill
# creation nudges, no background memory/skill review fork, no skills curator.
# (/v1/chat/completions is stateless and we never send X-Hermes-Session-Id, so
# every request is its own session; the front door passes the user's own
# history in the prompt.) Keys verified against NousResearch/hermes-agent
# cli-config.yaml.example and docs/user-guide/features/curator.md.
skills:
  creation_nudge_interval: 0
curator:
  enabled: false
auxiliary:
  background_review:
    enabled: false

# Compact before the 64k window fills. Hermes computes the trigger as
# (window * ratio, floored/raised for small windows ~ 48k at 64k) and then
# clamps it DOWN to threshold_tokens (agent/context_compressor.py
# _apply_threshold_tokens_cap), so 48000 is what actually fires.
compression:
  enabled: true
  threshold_tokens: 48000

# Hermes keeps a session store (state.db) of ended sessions; prune aggressively.
# agent.py's idle wiper additionally clears sessions/memories dirs
# (pm-agent/state_wipe.py).
sessions:
  auto_prune: true
  retention_days: 1

terminal:
  backend: local

display:
  tool_progress: log
  interim_assistant_messages: false

# The ONLY tool server. Tools bind the active user from a server-side
# request-context file, not from model arguments. The Steward read-only pair
# (query_memories, query_specs) is intentionally not wired in v1: it would
# need a third credential in pm-agent-secrets. If added later it must carry
# `tools: {include: [query_memories, query_specs]}`; tests/test_pm_agent.py
# fails on any other server or tool.
mcp_servers:
  pm_tools:
    command: "python"
    args: ["/opt/company-ops/pm-agent/pm_tools_mcp.py"]
    env:
      PM_DATABASE_URL: "${PM_DATABASE_URL}"
      HIVE_URL: "${HIVE_URL}"
      PM_CONTEXT_PATH: "/run/pm-agent/context.json"
      PYTHONPATH: "/opt/company-ops:/opt/company-ops/pm-agent"
    tools:
      include: [find_similar_signal, file_feedback_work]
      prompts: false
      resources: false
    connect_timeout: 30
    # Per tool call (a DB insert / Hive POST). Reply budget, outermost first:
    # app proxy 60s > front door (agent.py LLM_TIMEOUT_SECONDS) 50s.
    timeout: 30

# Loopback only; the per-boot key is generated by entrypoint.sh and never
# stored in a Secret.
platforms:
  api_server:
    enabled: true
    extra:
      key: "${API_SERVER_KEY}"
      host: "127.0.0.1"

# Exactly one toolset: the pm_tools MCP server. NOT hermes-api-server, whose
# composite includes the built-in terminal/file/web toolsets.
platform_toolsets:
  api_server:
    - pm_tools
